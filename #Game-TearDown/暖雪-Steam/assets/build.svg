<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">构筑：初始方向与局内选择</title><desc id="desc">依据 WS-F04 / WS-F05 · 节点是设计分析，并非完整操作流程</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#77d6c2" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" rx="24" fill="#13212c"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="62" fill="#77d6c2" font-size="17">GAME TEARDOWN · 原创机制示意</text><text x="60" y="115" fill="#f3f3ec" font-size="32" font-weight="700">构筑：初始方向与局内选择</text><text x="60" y="155" fill="#b2c2cb" font-size="19">从玩法承诺到成型路径；关注没有关键掉落时的应对</text><rect x="60" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="82" y="245" fill="#77d6c2" font-size="15">01</text><text x="82" y="284" fill="#ffffff" font-size="23" font-weight="700">宗派方向</text><text x="82" y="325" fill="#c5d1d7" font-size="18">开局形成预期</text><text x="82" y="354" fill="#c5d1d7" font-size="18">理解主战斗方式</text><path d="M310,306 H333" stroke="#77d6c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="338" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="360" y="245" fill="#77d6c2" font-size="15">02</text><text x="360" y="284" fill="#ffffff" font-size="23" font-weight="700">局内选项</text><text x="360" y="325" fill="#c5d1d7" font-size="18">秘籍／圣物／神兵</text><text x="360" y="354" fill="#c5d1d7" font-size="18">选择补强或转型</text><path d="M588,306 H611" stroke="#77d6c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="616" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="638" y="245" fill="#77d6c2" font-size="15">03</text><text x="638" y="284" fill="#ffffff" font-size="23" font-weight="700">协同成型</text><text x="638" y="325" fill="#c5d1d7" font-size="18">触发链可解释</text><text x="638" y="354" fill="#c5d1d7" font-size="18">不只叠加属性</text><path d="M866,306 H889" stroke="#77d6c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="894" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="916" y="245" fill="#77d6c2" font-size="15">04</text><text x="916" y="284" fill="#ffffff" font-size="23" font-weight="700">挑战检验</text><text x="916" y="325" fill="#c5d1d7" font-size="18">发现短板</text><text x="916" y="354" fill="#c5d1d7" font-size="18">调整下一步目标</text><rect x="60" y="446" width="1080" height="80" rx="12" fill="#27363d"/><text x="82" y="479" fill="#f1d28c" font-size="18">设计问题</text><text x="82" y="509" fill="#e1e5e4" font-size="19">随机选项是否提供替代路线，还是让玩家等待唯一正确答案？</text><text x="60" y="567" fill="#91a6b2" font-size="16">依据 WS-F04 / WS-F05 · 节点是设计分析，并非完整操作流程</text><text x="60" y="593" fill="#91a6b2" font-size="14">图示用于解释机制关系，不代表原作 UI 或内部实现。</text></g></svg>
