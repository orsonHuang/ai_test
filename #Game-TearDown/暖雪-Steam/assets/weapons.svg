<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">神兵：数值之外还有条件收益</title><desc id="desc">依据 WS-F06 · 价值拆分为分析推断，不是实测强度排名</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#77d6c2" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" rx="24" fill="#13212c"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="62" fill="#77d6c2" font-size="17">GAME TEARDOWN · 原创机制示意</text><text x="60" y="115" fill="#f3f3ec" font-size="32" font-weight="700">神兵：数值之外还有条件收益</text><text x="60" y="155" fill="#b2c2cb" font-size="19">参考比较框架；不推定原作伤害公式</text><rect x="60" y="208" width="338.6666666666667" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="82" y="245" fill="#77d6c2" font-size="15">01</text><text x="82" y="284" fill="#ffffff" font-size="23" font-weight="700">基础提升</text><text x="82" y="325" fill="#c5d1d7" font-size="18">属性与品质</text><text x="82" y="354" fill="#c5d1d7" font-size="18">当前直接收益</text><rect x="430.6666666666667" y="208" width="338.6666666666667" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="452.6666666666667" y="245" fill="#77d6c2" font-size="15">02</text><text x="452.6666666666667" y="284" fill="#ffffff" font-size="23" font-weight="700">条件联动</text><text x="452.6666666666667" y="325" fill="#c5d1d7" font-size="18">宗派／圣物／秘籍</text><text x="452.6666666666667" y="354" fill="#c5d1d7" font-size="18">满足条件才有价值</text><rect x="801.3333333333334" y="208" width="338.6666666666667" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="823.3333333333334" y="245" fill="#77d6c2" font-size="15">03</text><text x="823.3333333333334" y="284" fill="#ffffff" font-size="23" font-weight="700">替换代价</text><text x="823.3333333333334" y="325" fill="#c5d1d7" font-size="18">失去原有效果</text><text x="823.3333333333334" y="354" fill="#c5d1d7" font-size="18">可能改变构筑路线</text><rect x="60" y="446" width="1080" height="80" rx="12" fill="#27363d"/><text x="82" y="479" fill="#f1d28c" font-size="18">设计问题</text><text x="82" y="509" fill="#e1e5e4" font-size="19">一件品质更高的武器，是否真的更适合眼前这套构筑？</text><text x="60" y="567" fill="#91a6b2" font-size="16">依据 WS-F06 · 价值拆分为分析推断，不是实测强度排名</text><text x="60" y="593" fill="#91a6b2" font-size="14">图示用于解释机制关系，不代表原作 UI 或内部实现。</text></g></svg>
