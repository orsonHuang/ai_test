<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">成长：当局选择与永久积累分层</title><desc id="desc">依据 WS-F07 · 三类成长贡献的拆分为分析方法</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#77d6c2" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" rx="24" fill="#13212c"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="62" fill="#77d6c2" font-size="17">GAME TEARDOWN · 原创机制示意</text><text x="60" y="115" fill="#f3f3ec" font-size="32" font-weight="700">成长：当局选择与永久积累分层</text><text x="60" y="155" fill="#b2c2cb" font-size="19">官方确认天赋可永久强化；存档分层是迁移项目建议</text><rect x="60" y="208" width="338.6666666666667" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="82" y="245" fill="#77d6c2" font-size="15">01</text><text x="82" y="284" fill="#ffffff" font-size="23" font-weight="700">当局构筑</text><text x="82" y="325" fill="#c5d1d7" font-size="18">随机选择与配合</text><text x="82" y="354" fill="#c5d1d7" font-size="18">本次挑战的策略</text><rect x="430.6666666666667" y="208" width="338.6666666666667" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="452.6666666666667" y="245" fill="#77d6c2" font-size="15">02</text><text x="452.6666666666667" y="284" fill="#ffffff" font-size="23" font-weight="700">永久天赋</text><text x="452.6666666666667" y="325" fill="#c5d1d7" font-size="18">红色灵魂投入</text><text x="452.6666666666667" y="354" fill="#c5d1d7" font-size="18">跨挑战保留成长</text><rect x="801.3333333333334" y="208" width="338.6666666666667" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="823.3333333333334" y="245" fill="#77d6c2" font-size="15">03</text><text x="823.3333333333334" y="284" fill="#ffffff" font-size="23" font-weight="700">玩家熟练度</text><text x="823.3333333333334" y="325" fill="#c5d1d7" font-size="18">识别攻击与规则</text><text x="823.3333333333334" y="354" fill="#c5d1d7" font-size="18">持续学习的收益</text><rect x="60" y="446" width="1080" height="80" rx="12" fill="#27363d"/><text x="82" y="479" fill="#f1d28c" font-size="18">设计问题</text><text x="82" y="509" fill="#e1e5e4" font-size="19">通关改善来自学习、永久数值，还是这次拿到了更好的组合？</text><text x="60" y="567" fill="#91a6b2" font-size="16">依据 WS-F07 · 三类成长贡献的拆分为分析方法</text><text x="60" y="593" fill="#91a6b2" font-size="14">图示用于解释机制关系，不代表原作 UI 或内部实现。</text></g></svg>
