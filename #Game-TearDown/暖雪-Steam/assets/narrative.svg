<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">叙事：重复挑战中的信息进展</title><desc id="desc">依据 WS-F10 · 理解过程为分析抽象，不涉及结局解锁条件</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#77d6c2" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" rx="24" fill="#13212c"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="62" fill="#77d6c2" font-size="17">GAME TEARDOWN · 原创机制示意</text><text x="60" y="115" fill="#f3f3ec" font-size="32" font-weight="700">叙事：重复挑战中的信息进展</text><text x="60" y="155" fill="#b2c2cb" font-size="19">用收集推进理解，而不只增加收藏百分比</text><rect x="60" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="82" y="245" fill="#77d6c2" font-size="15">01</text><text x="82" y="284" fill="#ffffff" font-size="23" font-weight="700">再次探索</text><text x="82" y="325" fill="#c5d1d7" font-size="18">熟悉场景与人物</text><text x="82" y="354" fill="#c5d1d7" font-size="18">带着未解的问题</text><path d="M310,306 H333" stroke="#77d6c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="338" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="360" y="245" fill="#77d6c2" font-size="15">02</text><text x="360" y="284" fill="#ffffff" font-size="23" font-weight="700">发现碎片</text><text x="360" y="325" fill="#c5d1d7" font-size="18">获得新的信息</text><text x="360" y="354" fill="#c5d1d7" font-size="18">官方确认随机掉落</text><path d="M588,306 H611" stroke="#77d6c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="616" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="638" y="245" fill="#77d6c2" font-size="15">03</text><text x="638" y="284" fill="#ffffff" font-size="23" font-weight="700">重新理解</text><text x="638" y="325" fill="#c5d1d7" font-size="18">连接既有线索</text><text x="638" y="354" fill="#c5d1d7" font-size="18">产生新解释</text><path d="M866,306 H889" stroke="#77d6c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="894" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="916" y="245" fill="#77d6c2" font-size="15">04</text><text x="916" y="284" fill="#ffffff" font-size="23" font-weight="700">继续验证</text><text x="916" y="325" fill="#c5d1d7" font-size="18">带着理解回访</text><text x="916" y="354" fill="#c5d1d7" font-size="18">观察新的含义</text><rect x="60" y="446" width="1080" height="80" rx="12" fill="#27363d"/><text x="82" y="479" fill="#f1d28c" font-size="18">设计问题</text><text x="82" y="509" fill="#e1e5e4" font-size="19">不同的发现顺序，能否让玩家形成可理解的故事因果？</text><text x="60" y="567" fill="#91a6b2" font-size="16">依据 WS-F10 · 理解过程为分析抽象，不涉及结局解锁条件</text><text x="60" y="593" fill="#91a6b2" font-size="14">图示用于解释机制关系，不代表原作 UI 或内部实现。</text></g></svg>
