<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">章节：压力、选择与恢复交替</title><desc id="desc">依据 WS-F08 · 2022 本体公开记录，当前细节待实机复核</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#77d6c2" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" rx="24" fill="#13212c"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="62" fill="#77d6c2" font-size="17">GAME TEARDOWN · 原创机制示意</text><text x="60" y="115" fill="#f3f3ec" font-size="32" font-weight="700">章节：压力、选择与恢复交替</text><text x="60" y="155" fill="#b2c2cb" font-size="19">本体历史结构的抽象，不表示精确房间数和路由顺序</text><rect x="60" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="82" y="245" fill="#77d6c2" font-size="15">01</text><text x="82" y="284" fill="#ffffff" font-size="23" font-weight="700">房间战斗</text><text x="82" y="325" fill="#c5d1d7" font-size="18">执行当前构筑</text><text x="82" y="354" fill="#c5d1d7" font-size="18">承受敌人压力</text><path d="M310,306 H333" stroke="#77d6c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="338" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="360" y="245" fill="#77d6c2" font-size="15">02</text><text x="360" y="284" fill="#ffffff" font-size="23" font-weight="700">奖励选择</text><text x="360" y="325" fill="#c5d1d7" font-size="18">补足资源短板</text><text x="360" y="354" fill="#c5d1d7" font-size="18">决定发展方向</text><path d="M588,306 H611" stroke="#77d6c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="616" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="638" y="245" fill="#77d6c2" font-size="15">03</text><text x="638" y="284" fill="#ffffff" font-size="23" font-weight="700">休整</text><text x="638" y="325" fill="#c5d1d7" font-size="18">恢复与预算分配</text><text x="638" y="354" fill="#c5d1d7" font-size="18">准备下一阶段</text><path d="M866,306 H889" stroke="#77d6c2" stroke-width="2" marker-end="url(#arrow)"/><rect x="894" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="916" y="245" fill="#77d6c2" font-size="15">04</text><text x="916" y="284" fill="#ffffff" font-size="23" font-weight="700">首领检验</text><text x="916" y="325" fill="#c5d1d7" font-size="18">验证输出与生存</text><text x="916" y="354" fill="#c5d1d7" font-size="18">结束阶段目标</text><rect x="60" y="446" width="1080" height="80" rx="12" fill="#27363d"/><text x="82" y="479" fill="#f1d28c" font-size="18">设计问题</text><text x="82" y="509" fill="#e1e5e4" font-size="19">每次奖励选择是否受刚经历的战斗影响？</text><text x="60" y="567" fill="#91a6b2" font-size="16">依据 WS-F08 · 2022 本体公开记录，当前细节待实机复核</text><text x="60" y="593" fill="#91a6b2" font-size="14">图示用于解释机制关系，不代表原作 UI 或内部实现。</text></g></svg>
