return `<svg viewBox="0 0 100 132" fill="none" aria-hidden="true"><ellipse cx="50" cy="126" rx="36" ry="5" fill="#061b2266"/><path d="m28 69-17 52h78L73 69 52 62Z" fill="${color}"/><path d="m50 70-10 52H19l14-48m18-4 11 52h18L67 73" fill="#263e3e55"/><path d="M40 98v27m21-27v27" stroke="#243b3a" stroke-width="10"/>${head}${kind==='priest'?'<path d="M21 57v62M12 68h18" stroke="#d7be7d" stroke-width="4"/><circle cx="21" cy="53" r="5" stroke="#e6d59a" stroke-width="2"/>':kind==='ranger'?'<path d="M78 58q28 28 0 62V58Z" stroke="#d1bb89" stroke-width="3"/>':kind==='flame'?'<path d="M21 101q-10-18 0-30c0 15 14 7 10 22" fill="#f2b571"/>':monster?'':`<path d="M75 60v48m-9-14h18" stroke="#ddd2a9" stroke-width="4"/><path d="m16 77 19-4 8 6v20l-15 11-15-11Z" fill="#425f59" stroke="#ccbc85" stroke-width="2"/>`}<path d="M38 76h24" stroke="#d8c291" stroke-width="3"/></svg>`;}
function mapSVG(decorative=false){let s=state||{current:'village',revealed:['village','briar','ruins'],path:[]};let defs='<filter id="landshadow"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#071e28" flood-opacity=".65"/></filter><pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".65" fill="#ffffff" opacity=".055"/></pattern>';
let cells=Object.entries(REGIONS).map(([id,r])=>{const known=s.revealed.includes(id)||decorative,current=id===s.current&&!decorative,available=!decorative&&canTravel(s,id),seen=known||r.known;let fill=known?(r.tier===4?'#6c6555':r.set==='ember'?'#8a8064':r.set==='storm'?'#778b80':'#7f8d6b'):'#304a55';if(current)fill='#929a74';if(s.path.includes(id)&&!current)fill='#536d65';let trees='';for(let n=0;n<13;n++){const x=105+(n*89+r.x*3)%490,y=95+(n*111+r.y*2)%630;trees+=`<path d="m${x} ${y} -8 14h5l-7 10h20l-7-10h5Z" fill="${known?'#284f3840':'#7792990b'}"/>`;}
defs+=`<clipPath id="clip-${id}"><polygon points="${r.p}"/></clipPath>`;
let body=`<polygon class="region-shape" points="${r.p}" fill="${fill}"/><g clip-path="url(#clip-${id})">${trees}<polygon points="${r.p}" fill="url(#grain)"/><path d="M${r.x-70} ${r.y+65}q80-70 170-30m-160 5q55-30 130-20" stroke="#bed0b424" stroke-width="1" fill="none"/></g>`;
if(seen){body+=`<g transform="translate(${r.x-17},${r.y-43})" color="${current?'#ffe5a4':known?'#e6dfbe':'#baa67c'}">${icon(r.icon).replace('class="icon"','width="34" height="34"')}</g><text class="map-label" x="${r.x}" y="${r.y+10}" text-anchor="middle">${r.name}</text><text class="map-sub" x="${r.x}" y="${r.y+28}" text-anchor="middle">${current?'◆ 小队所在':r.tier===0?'旅程的起点':r.tier===4?'最终目标':available?'可前进 · 6 时段':known?SETS[r.set].name:'已知首领 · '+r.boss}</text>`;}else{body+=`<text x="${r.x}" y="${r.y}" text-anchor="middle" fill="#a1b7b25c" font-size="20">∿</text><text x="${r.x}" y="${r.y+19}" text-anchor="middle" fill="#a1b7b278" font-size="11" letter-spacing="3">战争迷雾</text>`;}
if(available)body+=`<circle cx="${r.x+49}" cy="${r.y-27}" r="9" fill="#dfc58a"/><path d="m${r.x+46} ${r.y-30} 4 3-4 3" stroke="#385342" fill="none" stroke-width="2"/>`;
return `<g ${decorative?'':`data-region="${id}" role="button" tabindex="0" aria-label="${r.name}${available?'，可前进':''}"`} class="region-cell ${current?'current':''} ${id===selection&&!decorative?'selected':''}">${body}</g>`;}).join('');
return `<svg class="world" viewBox="40 20 650 790" xmlns="http://www.w3.org/2000/svg" aria-label="从南方鹿鸣村到北方魔王城的远征地图"><defs>${defs}</defs><g opacity=".09" stroke="#c3d8c5" fill="none"><ellipse cx="365" cy="403" rx="313" ry="355"/><ellipse cx="365" cy="403" rx="295" ry="340"/><path d="M65 150H660M65 650H660M90 60V770M638 60V770"/></g><g filter="url(#landshadow)">${cells}</g><text x="83" y="576" fill="#8ca6a15c" font-family="Georgia" font-size="11" letter-spacing="5" transform="rotate(-80 83 576)">THE VEILED LANDS</text></svg>`;}
function header(){return `<header><div class="brand">${icon('castle')}<div><strong>雾境远征</strong><small>MISTBOUND · ROGUE IDLE</small></div></div><div class="header-info">${state?`<span class="desktop-only">远征 <span class="gold">${String(state.seed).slice(-6)}</span></span><span>${icon('coin')} <b class="gold">${state.gold}</b></span><span class="desktop-only">小队 Lv.${state.level}</span>`:'<span class="desktop-only">单人远征 · 自动回合制</span>'}<button class="small" data-cmd="help">玩法</button>${state?'<button class="small" data-cmd="restart">新远征</button>':''}</div></header>`;}
function footer(){return `<div class="footer"><span>HTML 玩法原型 v0.1 · 地图 → 构筑 → 自动战斗</span><span class="save-status">${state?(saveWorks?'进度自动保存在当前浏览器':'浏览器禁止存储，本次进度无法保存'):'一局约 10–15 分钟'}</span></div>`;}
function renderHome(){const saved=load();return `${header()}<main class="home"><section><div class="eyebrow">A SMALL PARTY. AN UNCERTAIN ROAD.</div><h1>走入迷雾<br>带回黎明。</h1><p class="intro">从鹿鸣村出发，召集两位同伴。把有限的探索时段花在值得的地方，收集首领套装，为最后的魔王之战做好准备。</p><div class="home-path">选路揭雾　 /　 探索构筑　 /　 自动交锋</div><div class="rule"></div><span class="eyebrow">01 / 选择起始战术</span><div class="choices">${[['guard','shield','坚守反击','护盾 · 荆棘套'],['burst','bow','标记爆发','破甲 · 猎风套'],['fire','fire','灼烧续航','灼烧 · 余烬套']].map(([k,i,n,d])=>`<button class="choice ${homeRole===k?'active':''}" data-role="${k}" aria-pressed="${homeRole===k}">${icon(i)}<strong>${n}</strong><small>${d}</small></button>`).join('')}</div><span class="eyebrow">02 / 第一位同行者</span><div class="choices">${['priest','ranger','guardian'].map(k=>`<button class="choice ${homeFriend===k?'active':''}" data-friend="${k}" aria-pressed="${homeFriend===k}"><strong>${KINDS[k].name}</strong><small>${k==='priest'?'自动治疗':k==='ranger'?'标记破甲':'护盾保护'}</small></button>`).join('')}</div><div class="startrow"><button class="primary" data-cmd="start">启程 ${icon('arrow')}</button>${saved?'<button data-cmd="continue">继续上次远征</button>':''}</div><p class="home-note">战术可在战前免费调整 · 每区 6 时段 · 战败结束本局</p></section><div class="home-art">${mapSVG(true)}</div></main>${footer()}`;}
function actionButton(key,name,desc,cost,ico){const used=state.regions[state.current]?.used.includes(key),repeat=['dungeon','rest','shop'].includes(key),disabled=!actionOK(state,key,cost)||(key==='shop'&&state.gold<25)||(key==='recruit'&&state.party.some(m=>m.kind===state.regions[state.current].recruit));return `<button class="action ${key==='dungeon'?'dungeon':''}" data-action="${key}" ${disabled?'disabled':''}>${icon(ico)}<span><strong>${name}</strong><small>${used&&!repeat?'已经探索':desc}</small></span><span class="cost">${used&&!repeat?'完成':cost+' 时段'}</span></button>`;}
function sidePanel(){const id=selection,r=REGIONS[id],current=id===state.current,known=state.revealed.includes(id),available=canTravel(state,id);if(!current){return `<div class="eyebrow">${known?'区域情报':'远方的传闻'} / ${r.tier===4?'终点':'第 '+r.tier+' 地带'}</div><h2>${known||r.known?r.name:'战争迷雾'}</h2><p class="area-desc">${known||r.known?r.desc:'尚未抵达的土地。进入相邻区域后，才能看清这里的机遇。'}</p><div class="rule"></div>${r.set&&(known||r.known)?setPreview(r.set,r.boss):''}${r.tier===4?'<div class="info-box">魔王每 3 回合横扫一次，影卫攻击后排。备好续航与防护。</div>':''}<div style="margin-top:25px">${available?`<button class="primary wide" data-travel="${id}">前进至${r.name} ${icon('arrow')}</button><p class="panel-note">${r.tier===4?'进入后可整备再挑战。':'获得 6 个探索时段，生命不会恢复。'}离开当前区域后无法返回。</p>`:'<p class="panel-note">这里不是当前区域的向前出口。先查看可前进的相邻区域。</p>'}<button class="wide" style="margin-top:12px" data-region="${state.current}">返回当前区域</button></div>`;}
let top=`<div class="eyebrow">${r.tier===0?'出发地':r.tier===4?'最后一战':'第 '+r.tier+' 地带 / 共 3 地带'}</div><h2>${r.name}</h2><p class="area-desc">${r.desc}</p>`;
if(id==='village')return top+`<div class="rule"></div><h3>旅程，由你选择</h3><p class="panel-note">左路通往荆棘林地，适合反击构筑；右路通往遗风丘陵，适合标记爆发，也能继续寻找余烬套装。</p><div class="info-box" style="margin-top:18px;background:#79885c0b;border-color:#68795130"><strong>北方的首领已在地图上标记</strong><p class="panel-note">点击远方地块，可预览首领与掉落。进入区域后，其相邻地块会自动揭雾。</p></div><div class="exits">${r.next.map(x=>`<button data-region="${x}">${REGIONS[x].name} ↗</button>`).join('')}</div><div class="rule"></div><p class="panel-note">小队已有一名同伴。旅途中还可招募一人。点击底部「整备小队」，调整阵位、技能与装备。</p><button class="primary wide" style="margin-top:18px" data-region="${state.skill==='guard'?'briar':'ruins'}">查看推荐起点 ${icon('arrow')}</button>`;
if(id==='castle')return top+`<div class="rule"></div><h3>决战前的最后整备</h3><p class="panel-note">所有探索时段都已留在身后。装备与阵位仍可免费调整，生命延续至最终战。</p><div class="info-box" style="margin-top:20px;background:#79885c0b;border-color:#68795130"><strong>黯冠魔王 + 噬光影卫</strong><p class="panel-note">魔王：570 生命，每 3 回合横扫全队。<br>影卫：132 生命，优先袭击后排。<br>建议：凑齐至少 2 件套，确保全队生命充足。</p></div><button class="wide" style="margin-top:22px" data-cmd="gear">整备小队</button><button class="primary wide" style="margin-top:10px" data-action="final">攻入魔王城 ${icon('sword')}</button>`;
const rd=state.regions[id];return top+`<div class="ap">${Array.from({length:6},(_,n)=>`<span class="ap-dot ${n>=state.ap?'empty':''}"></span>`).join('')}<b>${state.ap}<small> / 6</small></b></div><div class="flex between"><small>探索时段</small><small>不继承到下一区域</small></div><div class="actions">${actionButton('dungeon',r.boss,SETS[r.set].name+' · 可重复挑战',2,'castle')}${actionButton('chest','遗落宝箱','随机装备 + 15 金币',1,'chest')}${actionButton('event','路途奇遇',rd.event==='shrine'?'古老祭坛 · 选择祝福':rd.event==='forge'?'流浪锻工 · 资源交换':'落难旅人 · 取舍抉择',1,'book')}${actionButton('monster','清剿巡游敌人','战斗成长 + 12 金币',1,'sword')}${actionButton('recruit','招募同行者',KINDS[rd.recruit].name,1,'person')}${actionButton('rest','扎营休整','全队恢复 50% 最大生命',1,'camp')}${actionButton('shop','行商补给','花 25 金币，全队恢复 80%',1,'coin')}</div><div class="rule"></div><div class="flex between"><strong style="font-size:13px">${state.ap===0?'天色已晚，该继续前进了':'下一段旅程'}</strong><small>可提前离开</small></div><div class="exits">${r.next.map(x=>`<button data-region="${x}">${REGIONS[x].name} ↗</button>`).join('')}</div>`;}
function setPreview(set,boss){const x=SETS[set];return `<div class="eyebrow">${boss?'首领掉落 / '+boss:'套装效果'}</div><h3 style="margin:8px 0;color:inherit">${x.name}</h3><p class="panel-note"><b>2 件</b> · ${x.two}<br><b>3 件</b> · ${x.three}</p><p class="panel-note">前 3 件套装掉落优先补齐缺失部位。副本每次消耗 2 时段。</p>`;}
function partyBar(){return `<section class="partybar"><div class="party-title"><div class="eyebrow">YOUR EXPEDITION</div><h3>同行之人</h3><small>左侧前排 · 普攻优先承伤</small></div><div class="party-slots">${state.party.map((m,n)=>{let st=stats(state,m);return `<div class="party-tile"><div class="portrait">${portrait(m.kind)}</div><div class="party-data"><div class="party-name">${KINDS[m.kind].name}<span class="muted">${n===0?'前排':'后排'}</span></div><div class="hp-track"><span style="width:${m.hp/st.maxHp*100}%"></span></div><div class="hp-numbers">${m.hp} / ${st.maxHp}</div></div></div>`;}).join('')}${state.party.length<3?'<div class="party-tile empty-slot">＋ 等待新的同行者</div>':''}</div><button data-cmd="gear">整备小队 ${icon('arrow')}</button></section>`;}
function renderMap(){return `${header()}<main class="layout"><section class="map-side"><div class="map-top"><div class="eyebrow">THE VEILED LANDS</div><h2>迷雾之境</h2><p>道路只向前，选择留在身后。</p></div>${mapSVG()}<div class="map-legend"><span><i class="current"></i>小队所在</span><span><i></i>点击地块查看情报</span></div><svg class="compass" viewBox="0 0 60 75" aria-hidden="true"><text x="30" y="12" text-anchor="middle" fill="currentColor" font-size="12">N</text><path d="m30 20 7 25-7 22-7-22Z" fill="none" stroke="currentColor"/><path d="m10 45 20-7 20 7-20 7Z" fill="none" stroke="currentColor"/><path d="m30 20 7 25-7-7Z" fill="currentColor"/></svg></section><aside class="side">${sidePanel()}</aside></main>${partyBar()}${footer()}`;}
function renderBattle(){const b=state.battle,f=b.frames[b.index],finished=b.index===b.frames.length-1;const unitHTML=u=>`<div class="battle-unit ${u.boss?'boss':''} ${u.hp<=0?'dead':''} ${f.actor===u.id?'acting':''}"><div class="intent">${u.side==='enemy'&&u.hp>0?intention(u,f.round):u.hp<=0?'暂时倒下':u.kind==='hero'?SKILLS[state.skill].name:KINDS[u.kind].name.split(' · ')[0]}</div><div class="combat-portrait">${portrait(u.kind,true)}</div><strong>${u.name}</strong><div class="hp-track ${u.side==='enemy'?'enemy':''}"><span style="width:${u.hp/u.maxHp*100}%"></span></div><div class="hp-numbers">${u.hp} / ${u.maxHp}</div><div class="status-line">${u.shield?`<span class="status">盾 ${u.shield}</span>`:''}${u.burn?`<span class="status fire">灼烧 ${u.burn}</span>`:''}${u.mark?'<span class="status mark">标记</span>':''}</div></div>`;
return `${header()}<main class="battle"><div class="battle-top"><div><div class="eyebrow">${REGIONS[state.current].name} / AUTOMATIC COMBAT</div><h2>${b.type==='monster'?'巡游敌人':REGIONS[state.current].boss}</h2></div><div class="roundbadge">${finished?(b.won?'胜 利':'败 北'):'第 '+f.round+' 回合'}</div></div><section class="battle-field"><div class="versus"><div class="battle-team">${f.units.filter(u=>u.side==='ally').map(unitHTML).join('')}</div><div class="combat-middle">VS</div><div class="battle-team enemies">${f.units.filter(u=>u.side==='enemy').map(unitHTML).join('')}</div></div></section><div class="battle-bottom"><div class="battle-log" id="battle-log" aria-label="战斗记录">${b.frames.slice(Math.max(0,b.index-35),b.index+1).map((x,n,a)=>`<p class="${x.kind==='round'?'log-round':''} ${n===a.length-1?'latest':''}">${x.kind==='round'?'◆ ':''}${x.text}</p>`).join('')}</div><div class="battle-controls"><div class="flex between"><span class="eyebrow">自动战斗 · 战前策略执行中</span><span class="muted" style="font-size:11px">${b.index+1} / ${b.frames.length}</span></div><div class="turn-order">${f.order.map(x=>`<span class="${x.side==='enemy'?'enemy':''}">${x.name}</span>`).join('')}</div><div class="rule"></div>${finished?`<p style="font-size:13px">${b.won?'小队存活。战利品与剩余生命将带回地图。':'这次远征结束了。调整路线、搭配或休整节奏，再试一次。'}</p><button class="primary wide" data-cmd="claim">${b.won?(b.type==='final'?'迎接黎明':'领取战利品'):'查看远征记录'}</button>`:`<div class="flex"><button class="small" data-cmd="pause">${paused?'继续':'暂停'}</button>${[1,2,4].map(n=>`<button class="small ${speed===n?'primary':''}" data-speed="${n}" aria-label="${n}倍速">${n}×</button>`).join('')}<button class="small" style="margin-left:auto" data-cmd="skip">快速结算</button></div><p class="muted" style="font-size:11px;margin-top:14px">盾牌吸收伤害，标记降低护甲，灼烧每回合结算。战斗中不能更换配置。</p>`}</div></div></main>${footer()}`;}
function renderEnding(){const won=state.phase==='won',sets=setCounts(state);return `${header()}<main class="ending"><div class="reward-hero">${icon(won?'sun':'flag')}</div><div class="eyebrow">${won?'THE DAWN RETURNS':'EVERY JOURNEY LEAVES A TRACE'}</div><h1>${won?'黎明，再次降临。':'道路，暂止于此。'}</h1><p class="muted">${won?'三人的脚步，走到了迷雾的尽头。':'小队倒在'+REGIONS[state.current].name+'。下一次，让情报与准备替你多走一步。'}</p><div class="stats-row"><div><strong>${state.totals.wins}</strong><small>战斗胜利</small></div><div><strong>${state.totals.bosses}</strong><small>首领击败</small></div><div><strong>${state.totals.rounds}</strong><small>战斗回合</small></div><div><strong>${state.level}</strong><small>小队等级</small></div></div><div class="ending-route">${state.path.map(x=>REGIONS[x].name).join(' → ')}</div><div class="grid2" style="text-align:left"><div class="info-box"><h3>这一次的构筑</h3><p class="muted" style="margin-top:8px">${SKILLS[state.skill].name} + ${PASSIVES[state.passive].name}<br>${Object.keys(sets).filter(x=>sets[x]>0).map(x=>SETS[x].name+' '+sets[x]+' 件').join(' / ')||'旅人散件'}<br>${state.party.map(m=>KINDS[m.kind].name).join('、')}</p></div><div class="info-box"><h3>构筑留下的痕迹</h3><p class="muted" style="margin-top:8px">反击 ${state.totals.counters} 次 · 灼烧伤害 ${state.totals.burn}<br>队伍总伤害 ${state.totals.damage} · 治疗 ${state.totals.heal}<br>${won?'下次尝试不同套装与同行者。':'留一两个时段休整，并让守卫保护脆弱的队友。'}</p></div></div><button class="primary" style="margin-top:30px;padding:13px 35px" data-cmd="home">踏上新的远征 ${icon('arrow')}</button><p class="home-note">每局重新选路与构筑，无局外属性加成。</p></main>${footer()}`;}
function render(){document.getElementById('app').innerHTML=!state?renderHome():state.phase==='map'?renderMap():state.phase==='battle'?renderBattle():renderEnding();const log=document.getElementById('battle-log');if(log)log.scrollTop=log.scrollHeight;}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3200);}
function dialog(title,body,kind='generic'){const el=document.getElementById('modal');modalKind=kind;el.innerHTML=`<div class="dialog-head"><h2>${title}</h2><button class="small ghost" data-cmd="close" aria-label="关闭弹窗">✕</button></div><div class="dialog-body">${body}</div>`;if(!el.open)el.showModal();}
function closeDialog(){document.getElementById('modal').close();modalKind='';}
function itemText(it){return [['atk','攻击'],['def','护甲'],['maxHp','生命'],['spd','速度']].filter(([k])=>it[k]).map(([k,n])=>n+' +'+it[k]).join(' · ');}
function itemHTML(it,canEquip=true){const eq=state.equipped.includes(it.id),old=state.inventory.find(x=>x.id===state.equipped[it.slot]);return `<div class="item ${eq?'equipped':''}">${icon(SLOT_ICONS[it.slot])}<div class="item-main"><strong style="color:${it.set?SETS[it.set].color:'#dddbc7'}">${it.name}</strong><small>${SLOT_NAMES[it.slot]} · ${it.quality?'精良':'普通'} · ${it.affix}</small><small>${itemText(it)}</small>${!eq&&old?`<small class="muted">当前：${itemText(old)}</small>`:''}</div>${canEquip?`<button class="small ${eq?'ghost':'primary'}" data-equip="${it.id}" ${eq?'disabled':''}>${eq?'已装备':'装备'}</button>`:''}</div>`;}
function showGear(){const counts=setCounts(state),hero=state.party.find(m=>m.kind==='hero'),st=stats(state,hero);let body=`<div class="tabs"><button class="${gearTab==='gear'?'active':''}" data-tab="gear">装备与套装</button><button class="${gearTab==='tactics'?'active':''}" data-tab="tactics">战术与阵位</button></div>`;if(gearTab==='gear'){body+=`<p class="muted">主角：攻击 ${st.atk} / 护甲 ${st.def} / 速度 ${st.spd} / 生命 ${hero.hp}/${st.maxHp}<br>换装免费；增加最大生命不会自动补血。</p><div class="stack">${Object.keys(SETS).map(k=>`<div class="info-box"><div class="flex between"><strong style="color:${SETS[k].color}">${SETS[k].name}</strong><span class="pill">${counts[k]} / 3 件</span></div><div class="set-line ${counts[k]>=2?'on':''}">2 件 · ${SETS[k].two}</div><div class="set-line ${counts[k]>=3?'on':''}">3 件 · ${SETS[k].three}</div></div>`).join('')}</div><div class="rule"></div><h3>行囊 <small style="font:12px var(--sans)">${state.inventory.length} 件 · 仅主角装备</small></h3><div class="gear-grid">${[...state.inventory].reverse().map(it=>itemHTML(it)).join('')}</div>`;}else{body+=`<div class="grid2"><label>主动技能<select class="loadout-select" data-config="skill">${Object.entries(SKILLS).map(([k,v])=>`<option value="${k}" ${k===state.skill?'selected':''}>${v.name}</option>`).join('')}</select><p class="muted">${SKILLS[state.skill].desc}</p></label><label>被动战术<select class="loadout-select" data-config="passive">${Object.entries(PASSIVES).map(([k,v])=>`<option value="${k}" ${k===state.passive?'selected':''}>${v.name}</option>`).join('')}</select><p class="muted">${PASSIVES[state.passive].desc}</p></label></div><div class="rule"></div><h3>阵位顺序</h3><p class="muted">第一位承受敌方普通攻击。魔王横扫所有人，影卫专门攻击最后一位。每回合按速度行动，每人行动一次。</p><div class="stack">${state.party.map((m,n)=>`<div class="item"><div class="portrait">${portrait(m.kind)}</div><div class="item-main"><strong>${n+1}. ${KINDS[m.kind].name} ${n===0?'· 前排':''}</strong><small>${m.kind==='hero'?SKILLS[state.skill].desc:KINDS[m.kind].desc}</small><small>速度 ${stats(state,m).spd} · 生命 ${m.hp}/${stats(state,m).maxHp}</small></div><button class="small" data-front="${m.id}" ${n===0?'disabled':''}>移至前排</button></div>`).join('')}</div>`;}dialog('远征整备',body,'gear');}
function showReward(){const r=state.reward;if(!r)return;const it=state.inventory.find(x=>x.id===r.item);dialog(r.title,`<div class="reward-hero">${icon(it?'gem':'flag')}</div><p class="muted" style="text-align:center">${r.text}</p>${it?itemHTML(it):''}${it?.set?`<div class="info-box" style="margin-top:15px"><b>${SETS[it.set].name}</b><p class="muted" style="margin:6px 0 0">2 件：${SETS[it.set].two}<br>3 件：${SETS[it.set].three}</p></div>`:''}<div class="dialog-actions"><button class="primary" data-cmd="reward-done">继续探索</button></div>`,'reward');}
function showBattlePreview(type){const es=enemyParty(state,type);dialog(type==='final'?'最后的门已经开启':'挑战前情报',`<p class="muted">${type==='final'?'无需探索时段。战败将结束本局。':`确认后消耗 ${type==='dungeon'?2:1} 个探索时段。生命不会在战后自动补满。`}</p><div class="stack">${es.map(e=>`<div class="item"><div class="portrait">${portrait(e.kind)}</div><div><strong>${e.name}</strong><small>生命 ${e.hp} · 攻击 ${e.atk} · 护甲 ${e.def} · 速度 ${e.spd}</small><small>${e.boss?'第 2 回合蓄力，第 3 回合横扫全队，之后循环。':e.kind==='assassin'?'优先攻击后排。':'优先攻击前排。'}</small></div></div>`).join('')}</div>${type==='dungeon'?`<div class="info-box" style="margin-top:15px"><strong>必定掉落：${SETS[REGIONS[state.current].set].name}</strong><p class="muted" style="margin:5px 0 0">优先掉落尚未拥有的套装部位；重复挑战仍然掉落。</p></div>`:''}<div class="dialog-actions"><button data-cmd="gear">先整备</button><button class="primary" data-fight="${type}">开始自动战斗</button></div>`,'preview');}
function showRecruit(){const kind=state.regions[state.current].recruit;dialog('篝火旁的新面孔',`<div class="flex" style="align-items:flex-start"><div class="portrait" style="width:85px;height:100px">${portrait(kind)}</div><div><h3>${KINDS[kind].name}</h3><p class="muted" style="margin-top:10px">${KINDS[kind].desc}<br>招募消耗 1 时段，新同伴以当前等级满血加入。</p></div></div>${state.party.length<3?`<div class="dialog-actions"><button class="primary" data-hire="${kind}">邀请同行 · 1 时段</button></div>`:`<div class="rule"></div><p>队伍已满。选择一位同行者离队，装备仍由主角保管。</p><div class="flex wrap">${state.party.filter(m=>m.kind!=='hero').map(m=>`<button data-hire="${kind}" data-replace="${m.id}">替换 ${KINDS[m.kind].name}</button>`).join('')}</div>`}`,'recruit');}
function showEvent(){const e=state.regions[state.current].event;const config=e==='shrine'?['林间的无名祭坛','石碑上只剩两句能辨认的祷文。愿它护佑你接下来的道路。','全队恢复 35% 生命','下一场战斗主角攻击 +10']:e==='forge'?['火光里的流浪锻工','锻工愿意拿最后的材料换你的路费，也可以送你一条建议。','支付 15 金币，获得随机装备','收下补给：获得 12 金币']:['岔路边的落难旅人','旅人把最后的药草和钱袋摊在你面前。你只能带走一样。','全队恢复 35% 生命','获得 25 金币'];dialog(config[0],`<p class="muted">${config[1]}</p><div class="grid2" style="margin-top:22px"><button data-event="0" ${e==='forge'&&state.gold<15?'disabled':''}>${config[2]}<br><small>消耗 1 时段</small></button><button data-event="1">${config[3]}<br><small>消耗 1 时段</small></button></div>`,'event');}
function resolveEvent(choice){const e=state.regions[state.current].event;if(e==='forge'&&choice===0&&state.gold<15)return;if(!spend(state,'event',1))return;let item=null,text='';if(e==='forge'&&choice===0){state.gold-=15;item=makeItem(state,null,REGIONS[state.current].tier+1);state.inventory.push(item);text='锻工交给你一件崭新的装备。';}else if((e==='shrine'||e==='traveler')&&choice===0){text=`全队恢复 ${healParty(state,.35)} 生命。`;}else if(e==='shrine'){state.boon=10;text='下一场战斗，主角攻击 +10。';}else{let n=e==='forge'?12:25;state.gold+=n;text=`获得 ${n} 金币。`;}state.reward={title:'路途奇遇',text,item:item?.id||null};save();render();showReward();}
function tick(){clearTimeout(timer);if(!state||state.phase!=='battle'||paused)return;const b=state.battle;if(b.index>=b.frames.length-1)return;timer=setTimeout(()=>{if(!state||state.phase!=='battle'||paused)return;state.battle.index++;save();render();tick();},1150/speed);}
function doAction(key){if(key==='final'||key==='dungeon'||key==='monster'){if(key==='final'||actionOK(state,key,key==='dungeon'?2:1))showBattlePreview(key);return;}if(!actionOK(state,key,1))return;if(key==='recruit'){showRecruit();return;}if(key==='event'){showEvent();return;}if(key==='shop'&&state.gold<25)return;if(!spend(state,key,1))return;if(key==='chest'){const it=makeItem(state,null,REGIONS[state.current].tier);state.inventory.push(it);state.gold+=15;state.reward={title:'箱底的意外之喜',text:'获得一件装备与 15 金币。',item:it.id};}else if(key==='rest'||key==='shop'){if(key==='shop')state.gold-=25;toast(`全队恢复 ${healParty(state,key==='rest'?.5:.8)} 生命`);}save();render();if(state.reward)showReward();}
function help(){dialog('远征手册',`<p>一支三人小队，从新手村一路向北，击败魔王。</p><ol class="help-list"><li><b>选择前进方向：</b>点击相邻的可前进地块。进入后揭开周围迷雾，不能回头。远方已标注的首领可提前查看掉落。</li><li><b>每区 6 个探索时段：</b>副本 2 时段，宝箱、事件、招募、小怪、休整各 1 时段。可以提前离开，剩余时段不继承，生命不重置。</li><li><b>刷首领，凑套装：</b>副本可反复挑战，前 3 次掉落优先补齐部位。2 件启动流派，3 件强化。记得在整备中装备。</li><li><b>战前决定策略：</b>免费调整技能、被动与阵位。主角最多带 2 位同伴，普通攻击优先打前排。速度只影响行动顺序。</li><li><b>战斗自动执行：</b>可暂停、加速或快速结算。获胜后倒下队友以 1 生命归队；全队战败结束本局。</li><li><b>路线示例：</b>荆棘林地 → 苔石矿谷，凑反击套；遗风丘陵 → 银月渡口，搭游侠打标记；余烬荒原 → 灰烬边城，换引火术玩灼烧。</li></ol><p class="muted">当前浏览器自动保存，可关闭后继续。不同浏览器、不同网址及直接打开 HTML 的存档相互独立。本原型没有付费、账号或联网功能。</p>`,'help');}
function startNew(){const seed=crypto.getRandomValues(new Uint32Array(1))[0];state=newRun(seed,homeRole,homeFriend);selection='village';paused=false;save();render();toast('先点击地图地块查看情报，再决定出发方向。');}
function handleClick(e){const el=e.target.closest('button,[data-region]');if(!el||el.disabled)return;const d=el.dataset;
 if(d.role){homeRole=d.role;homeFriend=d.role==='burst'?'ranger':'priest';render();return;}if(d.friend){homeFriend=d.friend;render();return;}
 if(d.region){if(!state||state.phase!=='map')return;selection=d.region;render();return;}
 if(d.travel){const id=d.travel;if(!canTravel(state,id))return;if(state.current!=='village'&&state.ap>0){dialog('把剩余时段留在身后？',`<p>当前区域还剩 <b class="gold">${state.ap} 个时段</b>。前往${REGIONS[id].name}后无法返回，剩余时段作废。</p><p class="muted">生命不会恢复。出发前可以先休整。</p><div class="dialog-actions"><button data-cmd="close">继续探索</button><button class="primary" data-depart="${id}">确认前进</button></div>`,'travel');}else{travel(state,id);selection=id;save();render();}return;}
 if(d.depart){if(travel(state,d.depart)){selection=d.depart;closeDialog();save();render();}return;}
 if(d.action){if(state?.phase==='map')doAction(d.action);return;}
 if(d.fight){if(beginBattle(state,d.fight)){closeDialog();paused=false;save();render();tick();}return;}
 if(d.equip){if(equip(state,d.equip)){save();render();modalKind==='reward'?showReward():showGear();toast('装备已更换');}return;}
 if(d.tab){gearTab=d.tab;showGear();return;}
 if(d.front){if(state?.phase!=='map')return;const i=state.party.findIndex(m=>m.id===d.front);if(i>0){state.party.unshift(state.party.splice(i,1)[0]);save();render();showGear();}return;}
 if(d.hire){if(hire(state,d.hire,d.replace)){closeDialog();save();render();toast('新的同行者加入了远征。');}return;}
 if(d.event!==undefined){resolveEvent(Number(d.event));return;}
 if(d.speed){speed=Number(d.speed);render();tick();return;}
 switch(d.cmd){case 'start':if(load()){dialog('开启新的远征？','<p>新远征会覆盖当前浏览器中的上一局存档。</p><div class="dialog-actions"><button data-cmd="close">返回</button><button class="primary" data-cmd="confirm-start">开始新远征</button></div>');}else startNew();break;case 'confirm-start':closeDialog();startNew();break;case 'continue':state=load();if(state){selection=state.current;paused=state.phase==='battle';render();if(state.reward)showReward();}break;case 'help':help();break;case 'close':if(modalKind==='reward'){state.reward=null;save();}closeDialog();break;case 'gear':if(state?.phase==='map')showGear();break;case 'pause':paused=!paused;render();tick();break;case 'skip':clearTimeout(timer);state.battle.index=state.battle.frames.length-1;save();render();break;case 'claim':if(claimBattle(state)){selection=state.current;if(state.phase==='won'||state.phase==='lost')recordWin();save();render();if(state.reward)showReward();}break;case 'reward-done':state.reward=null;closeDialog();save();render();break;case 'restart':dialog('重新准备一场远征？','<p>当前进度仍会保留，直到你在出发界面确认开启新的一局。</p><div class="dialog-actions"><button data-cmd="close">留下</button><button class="primary" data-cmd="home">回到出发界面</button></div>');break;case 'home':closeDialog();clearTimeout(timer);state=null;render();break;}
}
const API={newRun,stats,setCounts,makeItem,travel,canTravel,equip,hire,spend,healParty,simulateBattle,beginBattle,claimBattle,REGIONS,SETS,KINDS,get state(){return state;}};
globalThis.RogueIdle=API;
if(!globalThis.__ROGUE_TEST__){document.addEventListener('click',handleClick);document.addEventListener('keydown',e=>{const x=e.target.closest?.('[data-region]');if(x&&(e.key==='Enter'||e.key===' ')){e.preventDefault();x.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});document.addEventListener('change',e=>{if(e.target.dataset.config&&state?.phase==='map'){const key=e.target.dataset.config,value=e.target.value;if((key==='skill'&&SKILLS[value])||(key==='passive'&&PASSIVES[value])){state[key]=value;save();render();showGear();}}});document.getElementById('modal').addEventListener('cancel',()=>{if(modalKind==='reward'){state.reward=null;save();}modalKind='';});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state?.phase==='battle'){paused=true;clearTimeout(timer);save();render();}});render();}
</script>
</body></html>
