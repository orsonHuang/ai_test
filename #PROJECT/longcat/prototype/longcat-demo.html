<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longcat Demo - 3关体验版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }
  .info {
    font-size: 0.9rem;
    opacity: 0.9;
    margin-bottom: 20px;
    text-align: center;
    max-width: 400px;
  }
  .game-container {
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .level-info {
    text-align: center;
    margin-bottom: 15px;
    font-size: 1.1rem;
    font-weight: bold;
  }
  .stats {
    display: flex;
    justify-content: space-around;
    margin-bottom: 15px;
    font-size: 0.9rem;
  }
  canvas {
    display: block;
    margin: 0 auto;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 70px);
    grid-template-rows: repeat(3, 70px);
    gap: 8px;
    margin-top: 20px;
    justify-content: center;
  }
  .btn {
    width: 70px;
    height: 70px;
    border: none;
    border-radius: 12px;
    font-size: 1.8rem;
    cursor: pointer;
    background: rgba(255,255,255,0.2);
    color: #fff;
    transition: all 0.15s;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
  .btn:active { background: rgba(255,255,255,0.4); transform: scale(0.95); }
  .btn.empty { visibility: hidden; }
  .message {
    text-align: center;
    margin-top: 15px;
    font-size: 1.2rem;
    font-weight: bold;
    min-height: 30px;
  }
  .message.win { color: #4ade80; }
  .message.lose { color: #f87171; }
  .btn-restart {
    margin-top: 15px;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    background: rgba(255,255,255,0.25);
    color: #fff;
    transition: all 0.15s;
  }
  .btn-restart:hover { background: rgba(255,255,255,0.35); }
  .keyboard-hint {
    margin-top: 15px;
    font-size: 0.8rem;
    opacity: 0.7;
    text-align: center;
  }
</style>
</head>
<body>
<h1>Longcat Demo</h1>
<div class="info">
  选一个方向，猫会滑到撞墙或撞自己才停。<br>
  走过的格子变成身体，填满全部空格即通关。
</div>

<div class="game-container">
  <div class="level-info" id="levelInfo">关卡 1 / 3</div>
  <div class="stats">
    <span>步数: <strong id="stepCount">0</strong></span>
    <span>剩余: <strong id="remainCount">0</strong></span>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div class="controls">
    <div class="btn empty"></div>
    <button class="btn" id="btnUp">↑</button>
    <div class="btn empty"></div>
    <button class="btn" id="btnLeft">←</button>
    <div class="btn empty"></div>
    <button class="btn" id="btnRight">→</button>
    <div class="btn empty"></div>
    <button class="btn" id="btnDown">↓</button>
    <div class="btn empty"></div>
  </div>
  <div class="message" id="message"></div>
  <button class="btn-restart" id="btnRestart">重新开始本关</button>
  <div class="keyboard-hint">键盘操作：↑ ↓ ← → / WASD</div>
</div>

<script>
// ========== 关卡定义 ==========
// W=墙, .=空格, C=猫起点
const LEVELS = [
  {
    name: "关卡 1 · 入门",
    // 5x5 简单
    grid: [
      "WWWWW",
      "W...W",
      "W.C.W",
      "W...W",
      "WWWWW",
    ]
  },
  {
    name: "关卡 2 · 小试",
    // 6x6 有一面内墙
    grid: [
      "WWWWWW",
      "W....W",
      "W.W..W",
      "W.W..W",
      "W.C..W",
      "WWWWWW",
    ]
  },
  {
    name: "关卡 3 · 挑战",
    // 7x7 更多墙
    grid: [
      "WWWWWWW",
      "W.....W",
      "W.WW..W",
      "W.....W",
      "W..WW.W",
      "W..C..W",
      "WWWWWWW",
    ]
  }
];

// ========== 游戏状态 ==========
const CELL_SIZE = 50;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let currentLevel = 0;
let grid = [];        // 0=空格, 1=墙, 2=身体
let rows = 0, cols = 0;
let headR = 0, headC = 0;
let body = [];        // [{r, c}] 头在[0]
let steps = 0;
let gameOver = false;
let lastDir = null;   // 'up','down','left','right'

// ========== 初始化 ==========
function initLevel(idx) {
  currentLevel = idx;
  const level = LEVELS[idx];
  rows = level.grid.length;
  cols = level.grid[0].length;
  canvas.width = cols * CELL_SIZE;
  canvas.height = rows * CELL_SIZE;

  grid = [];
  body = [];
  steps = 0;
  gameOver = false;
  lastDir = null;

  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      const ch = level.grid[r][c];
      if (ch === 'W') grid[r][c] = 1;
      else if (ch === 'C') {
        grid[r][c] = 2;
        headR = r; headC = c;
        body.push({r, c});
      } else {
        grid[r][c] = 0;
      }
    }
  }

  updateUI();
  draw();
}

// ========== 绘制 ==========
function draw() {
  // 背景
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * CELL_SIZE;
      const y = r * CELL_SIZE;

      if (grid[r][c] === 1) {
        // 墙
        ctx.fillStyle = '#4a4a6a';
        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
        ctx.fillStyle = '#3a3a5a';
        ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
      } else if (grid[r][c] === 2) {
        // 身体
        const isHead = (r === headR && c === headC);
        ctx.fillStyle = isHead ? '#ff6b6b' : '#ffa94d';
        ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);

        // 身体纹理
        if (!isHead) {
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.fillRect(x + 4, y + 4, CELL_SIZE - 8, CELL_SIZE - 8);
        }

        // 猫头装饰
        if (isHead) {
          ctx.fillStyle = '#fff';
          // 眼睛
          const eyeSize = 5;
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE * 0.35, y + CELL_SIZE * 0.4, eyeSize, 0, Math.PI * 2);
          ctx.arc(x + CELL_SIZE * 0.65, y + CELL_SIZE * 0.4, eyeSize, 0, Math.PI * 2);
          ctx.fill();
          // 瞳孔
          ctx.fillStyle = '#333';
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE * 0.35, y + CELL_SIZE * 0.4, 2.5, 0, Math.PI * 2);
          ctx.arc(x + CELL_SIZE * 0.65, y + CELL_SIZE * 0.4, 2.5, 0, Math.PI * 2);
          ctx.fill();
          // 鼻子
          ctx.fillStyle = '#ff9999';
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE * 0.5, y + CELL_SIZE * 0.6, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        // 空格
        ctx.fillStyle = '#2d2d44';
        ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
      }
    }
  }

  // 网格线
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= rows; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * CELL_SIZE);
    ctx.lineTo(cols * CELL_SIZE, r * CELL_SIZE);
    ctx.stroke();
  }
  for (let c = 0; c <= cols; c++) {
    ctx.beginPath();
    ctx.moveTo(c * CELL_SIZE, 0);
    ctx.lineTo(c * CELL_SIZE, rows * CELL_SIZE);
    ctx.stroke();
  }
}

// ========== 移动逻辑 ==========
function move(dir) {
  if (gameOver) return;

  // 禁止掉头
  const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
  if (lastDir && dir === opposites[lastDir]) {
    showMessage("不能掉头！", "lose");
    return;
  }

  const dirMap = {
    up: [-1, 0],
    down: [1, 0],
    left: [0, -1],
    right: [0, 1]
  };
  const [dr, dc] = dirMap[dir];

  // 滑行：逐格推进直到受阻
  const path = [];
  let curR = headR, curC = headC;

  while (true) {
    const nextR = curR + dr;
    const nextC = curC + dc;

    // 越界
    if (nextR < 0 || nextR >= rows || nextC < 0 || nextC >= cols) break;
    // 撞墙
    if (grid[nextR][nextC] === 1) break;
    // 撞身体
    if (grid[nextR][nextC] === 2) break;

    path.push({r: nextR, c: nextC});
    curR = nextR;
    curC = nextC;
  }

  // 无效移动
  if (path.length === 0) {
    showMessage("这个方向走不动", "lose");
    return;
  }

  // 提交：路径固化为身体
  for (const cell of path) {
    grid[cell.r][cell.c] = 2;
  }
  // 新路径插入到身体前面（头部）
  body = path.concat(body);
  headR = curR;
  headC = curC;
  steps++;
  lastDir = dir;

  // 胜负判定
  let emptyCount = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c] === 0) emptyCount++;
    }
  }

  if (emptyCount === 0) {
    gameOver = true;
    showMessage("通关！🎉", "win");
  } else if (isStuck()) {
    gameOver = true;
    showMessage("困死了！💀", "lose");
  } else {
    showMessage("", "");
  }

  updateUI();
  draw();
}

function isStuck() {
  // 检查四个方向是否全部无法移动
  const dirs = ['up', 'down', 'left', 'right'];
  const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const dirMap = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };

  for (const dir of dirs) {
    // 跳过反方向（不允许掉头）
    if (lastDir && dir === opposites[lastDir]) continue;

    const [dr, dc] = dirMap[dir];
    const nextR = headR + dr;
    const nextC = headC + dc;

    if (nextR >= 0 && nextR < rows && nextC >= 0 && nextC < cols) {
      if (grid[nextR][nextC] === 0) return false; // 有空格可走
    }
  }
  return true;
}

// ========== UI ==========
function updateUI() {
  document.getElementById('levelInfo').textContent =
    LEVELS[currentLevel].name + ` (${currentLevel + 1}/3)`;
  document.getElementById('stepCount').textContent = steps;

  let emptyCount = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c] === 0) emptyCount++;
    }
  }
  document.getElementById('remainCount').textContent = emptyCount;
}

function showMessage(text, type) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.className = 'message ' + (type || '');
}

// ========== 事件绑定 ==========
document.getElementById('btnUp').addEventListener('click', () => move('up'));
document.getElementById('btnDown').addEventListener('click', () => move('down'));
document.getElementById('btnLeft').addEventListener('click', () => move('left'));
document.getElementById('btnRight').addEventListener('click', () => move('right'));

document.getElementById('btnRestart').addEventListener('click', () => {
  initLevel(currentLevel);
  showMessage("", "");
});

// 键盘支持
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'arrowup' || key === 'w') move('up');
  else if (key === 'arrowdown' || key === 's') move('down');
  else if (key === 'arrowleft' || key === 'a') move('left');
  else if (key === 'arrowright' || key === 'd') move('right');
  else if (key === 'r') {
    initLevel(currentLevel);
    showMessage("", "");
  } else if (key === 'n') {
    // 下一关
    const next = (currentLevel + 1) % LEVELS.length;
    initLevel(next);
    showMessage("", "");
  }
});

// 通关/困死后按空格进入下一关
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && gameOver) {
    e.preventDefault();
    const next = (currentLevel + 1) % LEVELS.length;
    initLevel(next);
    showMessage("", "");
  }
});

// ========== 启动 ==========
initLevel(0);
</script>
</body>
</html>
