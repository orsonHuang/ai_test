<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>夏日狂欢 - 投喂鲨鱼冷饮 Demo</title>
<style>
  :root{
    --sky1:#7bdcff; --sky2:#fff4b7; --sea:#25b8d8; --sand:#ffd887;
    --blue:#20a8ff; --purple:#9e67ff; --gold:#ffc53a; --red:#ff5e66;
    --ink:#17405f; --card:rgba(255,255,255,.78);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eaf8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  .phone{width:min(430px,100vw);height:min(932px,100vh);position:relative;overflow:hidden;background:linear-gradient(#65d9ff 0 38%, #ffefac 38% 100%);box-shadow:0 20px 60px rgba(0,90,130,.24);border-radius:28px}
  .bg:before{content:"";position:absolute;left:-15%;right:-15%;top:32%;height:140px;background:radial-gradient(80px 20px at 18% 58%,rgba(255,255,255,.8),transparent 70%),radial-gradient(90px 28px at 60% 45%,rgba(255,255,255,.75),transparent 70%),linear-gradient(180deg,#20bbdc,#0d9ec5);border-radius:50% 50% 42% 45%;animation:wave 4s infinite ease-in-out;opacity:.95}
  .bg:after{content:"";position:absolute;left:-20%;right:-20%;bottom:-5%;height:46%;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.35) 0 8px,transparent 9px),radial-gradient(circle at 78% 33%,rgba(255,255,255,.25) 0 10px,transparent 11px),linear-gradient(#ffd982,#ffc86b);border-radius:52% 48% 0 0}
  @keyframes wave{50%{transform:translateX(14px) translateY(5px)}}
  .sun{position:absolute;right:28px;top:70px;width:74px;height:74px;border-radius:50%;background:#ffd84d;box-shadow:0 0 0 14px rgba(255,216,77,.25),0 0 55px rgba(255,188,48,.8)}
  .cloud{position:absolute;left:28px;top:82px;width:94px;height:38px;border-radius:40px;background:rgba(255,255,255,.75);filter:blur(.1px)} .cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:42px;height:42px;left:12px;top:-20px}.cloud:after{width:54px;height:54px;right:10px;top:-27px}
  header{position:relative;z-index:2;padding:20px 18px 0;display:flex;align-items:center;gap:10px;justify-content:space-between}.back,.rule{border:0;background:rgba(255,255,255,.55);height:34px;min-width:34px;border-radius:17px;font-weight:800;color:#1a7394}.title{flex:1;text-align:center;line-height:1}.title b{display:block;font-size:24px;color:#09537a;text-shadow:0 2px 0 #fff}.title span{font-size:12px;color:#2e80a1}
  .milestone{position:relative;z-index:2;margin:12px 16px 0;padding:10px 12px 12px;border-radius:18px;background:var(--card);box-shadow:0 8px 20px rgba(16,94,130,.14)}.ms-top{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.ms-track{position:relative;height:16px;background:#d7f0ff;border:2px solid #fff;border-radius:12px;margin-top:9px}.ms-fill{height:100%;width:32%;border-radius:10px;background:linear-gradient(90deg,#42c9ff,#ffcf47);transition:.35s}.chest{position:absolute;top:-15px;transform:translateX(-50%);font-size:21px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}.chest:nth-child(2){left:25%}.chest:nth-child(3){left:50%}.chest:nth-child(4){left:75%}.chest:nth-child(5){left:100%}
  .stage{position:relative;z-index:2;margin:16px 16px 0;height:388px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.16));border:2px solid rgba(255,255,255,.6);box-shadow:inset 0 0 30px rgba(255,255,255,.3)}.palm{position:absolute;left:2px;top:36px;font-size:98px;transform:rotate(-12deg);opacity:.68}.stall{position:absolute;right:26px;top:36px;width:88px;height:125px;border-radius:18px;background:linear-gradient(#ff7f75,#ffcf5a);box-shadow:0 8px 0 rgba(160,93,22,.12)}.stall:before{content:"COOL";position:absolute;left:13px;top:10px;color:#fff;font-weight:1000;font-size:22px;text-shadow:0 2px #f75}.stall:after{content:"🍹🧊";position:absolute;bottom:18px;left:18px;font-size:30px}
  .shark-wrap{position:absolute;left:34px;bottom:42px;width:238px;height:245px;display:grid;place-items:end center}.shadow{position:absolute;bottom:5px;width:178px;height:30px;background:rgba(60,88,90,.18);border-radius:50%;filter:blur(2px)}.shark{position:relative;width:205px;height:205px;animation:idle 2.4s infinite ease-in-out;transform-origin:50% 80%}.body{position:absolute;left:38px;top:38px;width:128px;height:145px;background:linear-gradient(160deg,#9ed7ee,#4e9fc6 60%,#307ea5);border-radius:60% 60% 50% 50%;box-shadow:inset -12px -13px 0 rgba(0,80,120,.14)}.belly{position:absolute;left:72px;top:90px;width:62px;height:78px;background:#f6fbff;border-radius:50%;opacity:.9}.finL,.finR{position:absolute;top:102px;width:48px;height:28px;background:#3a8eb7;border-radius:70% 20% 70% 20%}.finL{left:8px;transform:rotate(22deg)}.finR{right:8px;transform:scaleX(-1) rotate(22deg)}.tail{position:absolute;left:82px;top:0;width:38px;height:55px;background:#3f97bf;clip-path:polygon(50% 0,100% 55%,50% 42%,0 55%);animation:tail 1.5s infinite ease-in-out}.eye{position:absolute;top:75px;width:14px;height:14px;border-radius:50%;background:#06344b}.eye.l{left:76px}.eye.r{right:76px}.mouth{position:absolute;left:76px;top:110px;width:54px;height:28px;border-bottom:7px solid #113b54;border-radius:0 0 60px 60px;transition:.25s}.brow{position:absolute;top:64px;width:30px;height:8px;border-top:5px solid #164b65}.brow.l{left:63px;transform:rotate(22deg)}.brow.r{right:63px;transform:rotate(-22deg)}.sweat{position:absolute;left:53px;top:50px;font-size:32px;animation:blink 1.4s infinite}.bubbleFX{position:absolute;left:156px;top:58px;font-size:22px;opacity:0}.status-normal .brow{display:none}.status-normal .mouth{height:23px;border-bottom-color:#0a685c;transform:translateY(-2px)}.status-good .brow{display:none}.status-good .mouth{height:32px;border-bottom-color:#0a685c}.status-good .shark{animation:idle .95s infinite ease-in-out}.status-perfect .brow{display:none}.status-perfect .mouth{height:38px;border-bottom-color:#0a685c}.status-perfect .shark{animation:bounce 1.05s infinite ease-in-out}.status-perfect .bubbleFX{opacity:1;animation:spark 1.1s infinite}.status-over .brow{display:none}.status-over .eye{background:transparent}.status-over .eye:before{content:"@";color:#08354b;font-weight:900}.status-over .mouth{border-bottom-color:#b11a2a;height:14px;transform:rotate(180deg)}.status-over .shark{animation:shake .22s infinite}.status-over .bubbleFX{opacity:1}.state-label{position:absolute;left:28px;bottom:18px;padding:8px 14px;border-radius:16px;background:#fff;color:#147396;font-weight:900;box-shadow:0 5px 0 rgba(0,83,123,.12)}
  @keyframes idle{50%{transform:translateY(-8px)}}@keyframes tail{50%{transform:rotate(8deg)}}@keyframes blink{50%{opacity:.35}}@keyframes bounce{50%{transform:translateY(-16px) scale(1.035)}}@keyframes shake{50%{transform:translateX(4px) rotate(1deg)}}@keyframes spark{from{transform:translateY(15px);opacity:0}40%{opacity:1}to{transform:translateY(-20px);opacity:0}}
  .vertical{position:absolute;right:15px;bottom:36px;width:70px;height:252px}.tube{position:absolute;right:18px;bottom:0;width:28px;height:222px;border:4px solid #fff;background:rgba(255,255,255,.42);border-radius:22px;overflow:hidden;box-shadow:inset 0 0 9px rgba(0,103,160,.2)}.liquid{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg,#ff626a,#ffc941,#41caff);border-radius:18px 18px 0 0;transition:height .45s cubic-bezier(.2,1.5,.3,1)}.mark{position:absolute;right:0;transform:translateY(50%);width:62px;height:2px;background:#fff}.mark span{position:absolute;left:-2px;top:-13px;font-size:11px;font-weight:900;color:#fff;text-shadow:0 2px 2px #1a7191}.m50{bottom:50%}.m80{bottom:80%}.m90{bottom:90%}.m100{bottom:100%}.reward{position:absolute;right:48px;transform:translateY(50%);font-size:18px}.score{position:absolute;right:0;bottom:228px;min-width:58px;text-align:center;padding:4px 6px;border-radius:14px;background:#fff;font-weight:1000;color:#0f779b;box-shadow:0 4px 0 rgba(0,0,0,.1);transition:.25s}.score.bump{animation:bump .36s}@keyframes bump{50%{transform:scale(1.18)}}
  .controls{position:relative;z-index:3;margin:12px 16px 0;padding:12px;border-radius:24px;background:rgba(255,255,255,.84);box-shadow:0 12px 25px rgba(47,105,122,.17)}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.item{position:relative;border:0;border-radius:18px;padding:8px 5px 7px;background:linear-gradient(#fff,#e9faff);box-shadow:0 5px 0 #bde9f8;color:#15516d;font-weight:900}.item .ico{font-size:31px;display:block}.item small{display:block;font-size:10px;font-weight:800;color:#4b8498}.item.disabled{filter:grayscale(.8);opacity:.55}.item.special.ready{animation:glow 1.05s infinite;box-shadow:0 0 0 3px rgba(255,211,66,.75),0 5px 0 #ffd367}.i{position:absolute;right:7px;top:5px;background:#209ad1;color:#fff;border-radius:50%;width:15px;height:15px;font-size:11px;line-height:15px}@keyframes glow{50%{filter:brightness(1.12)}}.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.action{border:0;border-radius:18px;height:46px;font-size:15px;font-weight:1000;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12)}.pour{background:linear-gradient(#34ceff,#008ed5)}.finish{background:linear-gradient(#ffc94f,#ff9c16)}.finish:disabled{background:#b6c5cc}.tips{margin-top:9px;text-align:center;font-size:12px;font-weight:800;color:#4e8496}.toast{position:absolute;z-index:8;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);padding:18px 22px;border-radius:24px;background:rgba(9,68,94,.92);color:#fff;text-align:center;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.fly{position:absolute;z-index:7;font-size:32px;left:50%;bottom:160px;animation:fly .72s forwards ease-in}@keyframes fly{to{left:42%;bottom:385px;transform:scale(.4) rotate(28deg);opacity:0}}.reward-pop{position:absolute;z-index:9;inset:0;display:none;place-items:center;background:rgba(11,57,80,.38);backdrop-filter:blur(2px)}.reward-card{width:78%;padding:22px 18px 18px;border-radius:28px;background:linear-gradient(#fffef7,#e5f9ff);text-align:center;box-shadow:0 20px 40px rgba(0,50,80,.28)}.reward-card h2{margin:0 0 8px;font-size:28px}.reward-card p{margin:5px 0 15px;font-weight:900}.reward-card button{border:0;border-radius:18px;background:#15a7df;color:white;font-size:16px;font-weight:1000;padding:12px 34px}.footer{position:absolute;left:16px;right:16px;bottom:13px;z-index:2;display:flex;gap:8px}.navbtn{flex:1;border-radius:16px;border:0;background:rgba(255,255,255,.7);height:42px;font-weight:1000;color:#20617c}.rules{position:absolute;z-index:10;left:18px;right:18px;top:95px;padding:18px;border-radius:24px;background:#fff;box-shadow:0 20px 50px rgba(0,65,100,.25);display:none}.rules h3{margin:0 0 8px}.rules p{margin:6px 0;font-size:13px;font-weight:700}.rules button{float:right;border:0;background:#15a7df;color:#fff;border-radius:14px;padding:8px 18px;font-weight:900}
</style>
</head>
<body>
<div class="phone bg" id="app">
  <div class="sun"></div><div class="cloud"></div>
  <header><button class="back">‹</button><div class="title"><b>夏日狂欢</b><span>给鲨鱼送冷饮</span></div><button class="rule" onclick="showRules()">?</button></header>
  <section class="milestone"><div class="ms-top"><span>活动里程碑</span><span id="times">完成 0/10 次</span></div><div class="ms-track"><div class="ms-fill" id="msFill"></div><span class="chest">🎁</span><span class="chest">🏖️</span><span class="chest">🦈</span><span class="chest">💎</span></div></section>
  <main class="stage" id="stage"><div class="palm">🌴</div><div class="stall"></div>
    <div class="shark-wrap"><div class="shadow"></div><div class="shark"><div class="tail"></div><div class="finL"></div><div class="finR"></div><div class="body"></div><div class="belly"></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div><div class="sweat">💦</div><div class="bubbleFX">✨</div></div></div>
    <div class="vertical"><div class="score" id="score">0</div><div class="tube"><div class="liquid" id="liquid"></div></div><div class="mark m50"><span>50</span><b class="reward">🎁</b></div><div class="mark m80"><span>80</span><b class="reward">🥤</b></div><div class="mark m90"><span>90</span><b class="reward">🌟</b></div><div class="mark m100"><span>100</span><b class="reward">🏆</b></div></div>
    <div class="state-label" id="stateLabel">未完成 · 鲨鱼很热</div>
  </main>
  <section class="controls"><div class="items">
    <button class="item" onclick="addDrink('气泡水', '💧', rand(1,10), this)"><span class="ico">💧</span>气泡水<small>+1~10</small></button>
    <button class="item" onclick="addDrink('冰沙', '🥛', rand(11,30), this)"><span class="ico">🥛</span>冰沙<small>+11~30</small></button>
    <button class="item" onclick="addDrink('果汁', '🍹', rand(31,50), this)"><span class="ico">🍹</span>果汁<small>+31~50</small></button>
    <button class="item special" id="ice" onclick="iceCream(this)"><span class="i">i</span><span class="ico">🍦</span>冰淇淋<small>≥85补至100</small></button>
  </div><div class="action-row"><button class="action pour" onclick="autoPour()" id="autoBtn">一键倒入</button><button class="action finish" onclick="finish()" id="finishBtn" disabled>完成投喂</button></div><div class="tips" id="tips">点击冷饮投喂，进度达到 80 可领奖；完美/超量自动结算</div></section>
  <div class="footer"><button class="navbtn">任务</button><button class="navbtn">奖励预览</button><button class="navbtn">商店</button></div>
  <div class="toast" id="toast"></div>
  <div class="reward-pop" id="rewardPop"><div class="reward-card"><h2 id="rewardTitle">奖励获得</h2><p id="rewardText"></p><button onclick="closeReward()">收下</button></div></div>
  <div class="rules" id="rules"><h3>活动规则</h3><p>1. 完成关卡或任务获得基底冷饮。</p><p>2. 投喂鲨鱼会提升冷饮进度，不同冷饮分值不同。</p><p>3. 80 以上可完成投喂，90 以上更高品质，100 为完美。</p><p>4. 进度超过 100 进入超量，鲨鱼会被冷过头。</p><button onclick="hideRules()">知道了</button></div>
</div>
<script>
  let score=0, done=0, settling=false;
  const app=document.getElementById('app'), liquid=document.getElementById('liquid'), scoreEl=document.getElementById('score'), label=document.getElementById('stateLabel'), finishBtn=document.getElementById('finishBtn'), tips=document.getElementById('tips');
  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  function fly(icon){const f=document.createElement('div');f.className='fly';f.textContent=icon;app.appendChild(f);setTimeout(()=>f.remove(),760)}
  function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1200)}
  function update(){scoreEl.textContent=score>100?'100+':score;scoreEl.classList.remove('bump');void scoreEl.offsetWidth;scoreEl.classList.add('bump');liquid.style.height=Math.min(score,100)+'%';app.classList.remove('status-normal','status-good','status-perfect','status-over');let q='未完成 · 鲨鱼很热';let color='#20a8ff';finishBtn.disabled=score<80||settling;if(score>=101){app.classList.add('status-over');q='超量 · 冷过头了';color='#ff5e66'}else if(score>=100){app.classList.add('status-perfect');q='完美 · 满足到弹跳';color='#ffc53a'}else if(score>=90){app.classList.add('status-good');q='优质 · 非常满足';color='#9e67ff'}else if(score>=80){app.classList.add('status-normal');q='普通 · 放松微笑';color='#20a8ff'}label.textContent=q;liquid.style.background=`linear-gradient(180deg, ${color}, #66dfff)`;document.getElementById('ice').classList.toggle('ready',score>=85&&score<100);if(score>=100&&!settling){setTimeout(()=>finish(),500)}}
  function addDrink(name,icon,val){if(settling)return;if(score>100){toast('已经超量，不能继续添加');return}fly(icon);score+=val;tips.textContent=`${name} 倒入 +${val}，鲨鱼喝掉啦！`;update()}
  function iceCream(){if(settling)return;if(score<85){toast('达到 85 后可使用冰淇淋补至完美');return}if(score>=100){toast('已经达成完美');return}fly('🍦');let add=100-score;score=100;tips.textContent=`冰淇淋发动：补充 +${add} 到完美！`;update()}
  function autoPour(){if(settling)return;let seq=[['果汁','🍹',rand(31,50)],['冰沙','🥛',rand(11,30)],['气泡水','💧',rand(1,10)]];let i=0;function step(){if(score>=80||i>=seq.length){toast(score>=80?'已达到最低领奖值':'基底不足');update();return}addDrink(...seq[i++]);setTimeout(step,420)}step()}
  function finish(){if(score<80||settling)return;settling=true;let title='普通冷饮', reward='获得：金币 x500、气泡贴纸 x1';if(score>100){title='超量冷饮';reward='获得：红色礼包 x1，鲨鱼冷到冒烟！'}else if(score===100){title='完美冷饮';reward='获得：完美宝箱 x1、星星粒子 x20'}else if(score>=90){title='优质冷饮';reward='获得：紫色宝箱 x1、贝壳 x80'}document.getElementById('rewardTitle').textContent=title;document.getElementById('rewardText').textContent=reward;document.getElementById('rewardPop').style.display='grid'}
  function closeReward(){document.getElementById('rewardPop').style.display='none';done++;score=0;settling=false;document.getElementById('times').textContent=`完成 ${done}/10 次`;document.getElementById('msFill').style.width=Math.min(done*10,100)+'%';tips.textContent=done>=10?'一键倒入已解锁：高级＞中级＞初级':'继续给鲨鱼送冷饮吧';update()}
  function showRules(){document.getElementById('rules').style.display='block'} function hideRules(){document.getElementById('rules').style.display='none'}
  update();setTimeout(showRules,650);
</script>
</body>
</html>
