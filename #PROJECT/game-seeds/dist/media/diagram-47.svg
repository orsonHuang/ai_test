<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 930" role="img" aria-label="合作准备四层信息关系"><rect width="860" height="930" rx="24" fill="#eef2ed"/><g font-family="Microsoft YaHei,sans-serif"><text x="44" y="62" font-size="30" fill="#263f35">合作准备 · 从目标到操作</text><text x="44" y="98" font-size="18" fill="#617267">依据2026年3月官方截图简化重绘 · 非游戏画面</text><rect x="44" y="130" width="350" height="744" rx="26" fill="#e4e5da" stroke="#879a8b" stroke-width="2"/><rect x="68" y="158" width="302" height="140" rx="12" fill="#334b42"/><text x="88" y="198" font-size="22" fill="#fffdf3">① 本层挑战条件</text><text x="88" y="236" font-size="18" fill="#edf2e9">职业增益</text><text x="88" y="270" font-size="18" fill="#edf2e9">敌人特性</text><rect x="68" y="316" width="302" height="230" rx="12" fill="#c9d9c9"/><circle cx="219" cy="411" r="62" fill="#7c998b"/><text x="219" y="419" text-anchor="middle" font-size="24" fill="#fff">② 首领</text><text x="219" y="515" text-anchor="middle" font-size="18" fill="#2c4a3c">共同挑战对象</text><rect x="68" y="564" width="143" height="125" rx="12" fill="#b6d9cc"/><rect x="227" y="564" width="143" height="125" rx="12" fill="#b6d9cc"/><text x="88" y="601" font-size="22" fill="#29463a">③ 队长</text><text x="247" y="601" font-size="22" fill="#29463a">队员</text><text x="88" y="650" font-size="18" fill="#29463a">发起权限</text><text x="247" y="650" font-size="18" fill="#29463a">待准备</text><rect x="68" y="711" width="302" height="64" rx="10" fill="#d2d4cd"/><text x="219" y="752" text-anchor="middle" font-size="22" fill="#555e55">④ 挑战 · 灰置</text><text x="219" y="810" text-anchor="middle" font-size="18" fill="#435b4e">队友还未准备 · 方案入口</text><g fill="#334e40"><text x="430" y="200" font-size="24">先读规则</text><text x="430" y="236" font-size="19">深底分离复杂背景</text><text x="430" y="275" font-size="19">让阵容调整有具体理由</text><text x="430" y="393" font-size="24">再看目标</text><text x="430" y="432" font-size="19">体量强调共同面对的威胁</text><text x="430" y="471" font-size="19">装饰不能盖过状态</text><text x="430" y="603" font-size="24">确认谁参与</text><text x="430" y="642" font-size="19">身份、数值与准备分开表达</text><text x="430" y="751" font-size="24">知道下一步</text><text x="430" y="790" font-size="19">禁用原因靠近操作入口</text><text x="430" y="829" font-size="19">提示需要谁来行动</text></g></g></svg>