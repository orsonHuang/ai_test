<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470"><rect width="1000" height="470" fill="#f8f7f0"/><g font-family="Microsoft YaHei,sans-serif" fill="#294747"><text x="40" y="50" font-size="25" font-weight="bold">契灵：获取、判断与应用</text><text x="40" y="80" font-size="15">原创关系示意 · 参考2023年上线机制，非原作界面</text><rect x="40" y="120" width="270" height="110" rx="12" fill="#e7eee5" stroke="#b9cbb6"/><text x="60" y="162" font-size="23">探查</text><text x="60" y="198" font-size="17">体力 → 发现踪迹</text><rect x="365" y="120" width="270" height="110" rx="12" fill="#e7eee5" stroke="#b9cbb6"/><text x="385" y="162" font-size="23">结契</text><text x="385" y="198" font-size="17">式盘 → 获得契灵</text><rect x="690" y="120" width="270" height="110" rx="12" fill="#e7eee5" stroke="#b9cbb6"/><text x="710" y="162" font-size="23">比较</text><text x="710" y="198" font-size="17">技能 / 属性 / 术印</text><rect x="690" y="290" width="270" height="110" rx="12" fill="#e7eee5" stroke="#b9cbb6"/><text x="710" y="332" font-size="23">培养与配置</text><text x="710" y="368" font-size="17">主角方案 → PVE验证</text><rect x="365" y="290" width="270" height="110" rx="12" fill="#e7eee5" stroke="#b9cbb6"/><text x="385" y="332" font-size="23">保留或纳还</text><text x="385" y="368" font-size="17">锁定 / 引用 / 资源回流</text><g stroke="#698364" stroke-width="3" fill="none"><path d="M310 175h55m270 0h55m135 55v60m-135 55h-55"/></g><text x="40" y="440" font-size="16">先区分是否适用，再比较提升；御灵与契灵分别管理。</text></g></svg>
