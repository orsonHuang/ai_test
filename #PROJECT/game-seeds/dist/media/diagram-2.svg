<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">圣物：同一物品，四种位置价值</title><desc id="desc">依据 WS-F01 / WS-F02 · 2022 本体历史样本 · 不展示当前数值</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#77d6c2" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" rx="24" fill="#13212c"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="62" fill="#77d6c2" font-size="17">GAME TEARDOWN · 原创机制示意</text><text x="60" y="115" fill="#f3f3ec" font-size="32" font-weight="700">圣物：同一物品，四种位置价值</text><text x="60" y="155" fill="#b2c2cb" font-size="19">以北风花的历史本体效果为例；候选效果互相比较</text><rect x="60" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="82" y="245" fill="#77d6c2" font-size="15">01</text><text x="82" y="284" fill="#ffffff" font-size="23" font-weight="700">核心</text><text x="82" y="325" fill="#c5d1d7" font-size="18">主动风暴</text><text x="82" y="354" fill="#c5d1d7" font-size="18">围绕持续生效构筑</text><rect x="338" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="360" y="245" fill="#77d6c2" font-size="15">02</text><text x="360" y="284" fill="#ffffff" font-size="23" font-weight="700">力量</text><text x="360" y="325" fill="#c5d1d7" font-size="18">近战触发</text><text x="360" y="354" fill="#c5d1d7" font-size="18">鼓励近战命中</text><rect x="616" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="638" y="245" fill="#77d6c2" font-size="15">03</text><text x="638" y="284" fill="#ffffff" font-size="23" font-weight="700">敏捷</text><text x="638" y="325" fill="#c5d1d7" font-size="18">瞬身触发</text><text x="638" y="354" fill="#c5d1d7" font-size="18">位移参与联动</text><rect x="894" y="208" width="246" height="204" rx="14" fill="#203542" stroke="#3c5966"/><text x="916" y="245" fill="#77d6c2" font-size="15">04</text><text x="916" y="284" fill="#ffffff" font-size="23" font-weight="700">功效</text><text x="916" y="325" fill="#c5d1d7" font-size="18">冰霜伤害联动</text><text x="916" y="354" fill="#c5d1d7" font-size="18">放大已有触发链</text><rect x="60" y="446" width="1080" height="80" rx="12" fill="#27363d"/><text x="82" y="479" fill="#f1d28c" font-size="18">设计问题</text><text x="82" y="509" fill="#e1e5e4" font-size="19">不是只问哪件更强：还要问放在哪里、替换后会失去什么。</text><text x="60" y="567" fill="#91a6b2" font-size="16">依据 WS-F01 / WS-F02 · 2022 本体历史样本 · 不展示当前数值</text><text x="60" y="593" fill="#91a6b2" font-size="14">图示用于解释机制关系，不代表原作 UI 或内部实现。</text></g></svg>
