
server {
    server_name orson.games 159.75.127.135;

    root /var/www/orson-huang-homepage;
    index index.html;

    location /static/ {
        alias /home/ubuntu/awakening-demo/;
    }

    location /awakening/static/ {
        alias /home/ubuntu/awakening-demo/;
    }

    location /awakening {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/model-status { proxy_pass http://127.0.0.1:8080; }
    location /api/chat { proxy_pass http://127.0.0.1:8080; }
    location /api/status { proxy_pass http://127.0.0.1:8080; }
    location /api/reset { proxy_pass http://127.0.0.1:8080; }
    location /health { proxy_pass http://127.0.0.1:8080; }
    location /api/ {
        proxy_pass http://127.0.0.1:5800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/orson.games/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/orson.games/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
